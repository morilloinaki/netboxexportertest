[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-exporter"
version = "0.1.0"
description = "CLI para exportar inventario de NetBox a CSV/JSON"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
netbox-export = "netbox_exporter.cli:main"

[tool.setuptools]
packages = ["netbox_exporter"]
